<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Ajouter un employé</title>
  <link rel="stylesheet" href="style/ajouter_employer.css">
</head>
<body>

  <div class="container">
    <!-- Menu latéral -->
    <aside class="sidebar">
      <h2><i class="fas fa-users-cog"></i> Gestion d'employés</h2>
      <ul>
        <li><i class="fas fa-chart-line"></i> Tableau de bord</li>
        <li class="active"><i class="fas fa-user"></i> Employés</li>
        <li><i class="fas fa-briefcase"></i> Services</li>
      </ul>
    </aside>

    <!-- Contenu principal -->
    <main class="main-content">
      <h1>Ajouter un employé</h1>

      <!-- Section Informations personnelles -->
      <h2>Informations personnelles</h2>
      <div class="form-section">
        <form>
          <div class="form-left">
            <label>Nom</label>
            <input type="text" placeholder="Nom">

            <label>Prénom</label>
            <input type="text" placeholder="Prénom">

            <label>Date de naissance</label>
            <input type="date">

            <label>Email</label>
            <input type="email" placeholder="exemple@email.com">
          </div>

          <div class="form-right">
            <i class="fas fa-camera fa-3x photo-icon"></i>
          </div>
        </form>
      </div>

      <!-- Section Informations professionnelles -->
      <h2>Informations professionnelles</h2>
      <div class="form-section">
        <form>
          <div class="form-left">
            <label>Matricule</label>
            <input type="text" placeholder="EMP001">

            <label>Date d'embauche</label>
            <input type="date">

            <label>Type de contrat</label>
            <input type="text" placeholder="CDI, CDD...">
          </div>
        </form>
      </div>

      <!-- Section Documents -->
      <h2>Documents et justificatifs</h2>
      <div class="form-section">
        <form>
          <div class="form-left">
            <label>Ajouter un document</label>
            <input type="file">

            <label>Mot de passe</label>
            <input type="password" placeholder="Mot de passe">
          </div>
        </form>
      </div>

      <!-- Boutons -->
      <div class="button-group">
        <button class="btn cancel">Annuler</button>
        <button class="btn save">Enregistrer</button>
      </div>
    </main>
  </div>

</body>
</html>
