<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Ajouter un service</title>
  <link rel="stylesheet" href="style/ajouter_un_service.css">
</head>
<body>
  <div class="container">
    <!-- Menu latéral -->
    <aside class="sidebar">
      <h2><i class="fas fa-users-cog"></i> Gestion d'employés</h2>
      <ul>
        <li><i class="fas fa-chart-line"></i> Tableau de bord</li>
        <li><i class="fas fa-user"></i> Employés</li>
        <li><i class="fas fa-briefcase"></i> Services</li>
      </ul>
    </aside>

    <!-- Contenu principal -->
    <main class="main-content">
      <h1>Ajouter un service</h1>

      <div class="form-section">
        <label for="nom">Nom</label>
        <input type="text" id="nom" name="nom" placeholder="Nom du service">
      </div>

      <div class="form-section">
        <label for="recherche">Rechercher</label>
        <input type="text" id="recherche" name="recherche" placeholder="Rechercher un service...">
      </div>

      <div class="button-group">
        <button class="btn cancel">Annuler</button>
        <button class="btn save">Enregistrer</button>
      </div>
    </main>
  </div>
</body>
</html>
