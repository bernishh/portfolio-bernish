<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Gestion des employés</title>
  <link rel="stylesheet" href="style/gestion_des_employer.css">
</head>
<body>

  <div class="dashboard">
    <!-- Menu latéral -->
    <aside class="sidebar">
      <h2><i class="fas fa-users-cog"></i> Gestion d'employés</h2>
      <ul>
        <li><a href="tableau_de_bord.html" class="add-button">tableau_de_bord</a></li>

      </ul>

    <!-- Contenu principal -->
    <main class="main-content">
      <div class="header">
        <h1>Gestion des employés</h1>
        <button class="btn-add">Ajouter un employé</button>
      </div>

      <div class="search-bar">
        <input type="text" placeholder="Rechercher un employé...">

      <table class="employee-table">
        <thead>
          <tr>
            <th>Nom</th>
            <th>Prénom</th>
            <th>Service</th>
            <th>Poste</th>
            <th>Date d'embauche</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Diallo</td>
            <td>Fatou</td>
            <td>RH</td>
            <td>Assistante</td>
            <td>12/02/2020</td>
          </tr>
          <tr>
            <td>Nguyen</td>
            <td>Minh</td>
            <td>Informatique</td>
            <td>Développeur</td>
            <td>03/03/2022</td>
          </tr>
          <!-- Tu peux ajouter plus de lignes ici -->

      </table>
