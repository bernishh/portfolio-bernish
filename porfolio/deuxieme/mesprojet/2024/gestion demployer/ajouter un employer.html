<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Ajouter un employé</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="form-container">
    <h1>Ajouter un employé</h1>

    <h2>Informations personnelles</h2>
    <form action="#" method="POST" enctype="multipart/form-data">
      <div class="form-group">
        <label for="nom">Nom :</label>
        <input type="text" id="nom" name="nom" required>
      </div>

      <div class="form-group">
        <label for="prenom">Prénom :</label>
        <input type="text" id="prenom" name="prenom" required>
      </div>

      <div class="form-group">
        <label for="date_naissance">Date de naissance :</label>
        <input type="date" id="date_naissance" name="date_naissance" required>
      </div>

      <div class="form-group">
        <label for="email">Adresse mail :</label>
        <input type="email" id="email" name="email" required>
      </div>

      <h2>Informations professionnelles</h2>

      <div class="form-group">
        <label for="matricule">Matricule :</label>
        <input type="text" id="matricule" name="matricule" required>
      </div>

      <div class="form-group">
        <label for="date_embauche">Date d'embauche :</label>
        <input type="date" id="date_embauche" name="date_embauche" required>
      </div>

      <div class="form-group">
        <label for="type_contrat">Type de contrat :</label>
        <select id="type_contrat" name="type_contrat" required>
          <option value="">-- Sélectionnez --</option>
          <option value="CDI">CDI</option>
          <option value="CDD">CDD</option>
          <option value="Stage">Stage</option>
          <option value="Alternance">Alternance</option>
        </select>
      </div>

      <h2>Documents et justificatifs</h2>

      <div class="form-group">
        <label for="documents">Télécharger des fichiers :</label>
        <input type="file" id="documents" name="documents[]" multiple>
      </div>

      <div class="form-group">
        <label for="mot_de_passe">Mot de passe :</label>
        <input type="password" id="mot_de_passe" name="mot_de_passe" required>
      </div>

      <div class="form-actions">
        <button type="reset" class="btn cancel">Annuler</button>
        <button type="submit" class="btn submit">Enregistrer</button>
      </div>
    </form>
  </div>
</body>
</html>
