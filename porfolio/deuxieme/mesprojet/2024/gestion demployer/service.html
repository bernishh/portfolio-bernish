<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="dashboard-container">
    
    <!-- Menu latéral -->
    <aside class="sidebar">
      <ul>
        <li><i class="fas fa-home"></i> Home</li>
        <li><i class="fas fa-envelope"></i> Contact</li>
        <li><i class="fas fa-book"></i> Carnet</li>
      </ul>
    </aside>

    <!-- Contenu principal -->
    <main class="main-content">
      <div class="header">
        <h1>Services</h1>
        <button class="add-button">Ajouter</button>
      </div>

      <div class="service-boxes">
        <div class="box">Ressources Humaines</div>
        <div class="box">Marketing</div>
        <div class="box">Ventes</div>
        <div class="box">Support</div>
        <div class="box">Informatique</div>
      </div>
    </main>

  </div>
</body>
</html>
