<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Document</title>
</head>
<body class="bg-white-800">
    <header class="w-full bg-gray-100 h-28   flex  items-center  ">
        <div class="bg-red- w-1/2 min-h-full flex justify-end items-center align-center">
            <nav>
                <ul class="flex gap-9 ">
                    <li><a href="#">Accueil</a></li>
                    <li><a href="#">Abonnement</a></li>
                    <li><a href="#">Paiement</a></li>
                    <li><a href="#">Client</a></li>
                    
            </ul> 
            </nav>
        </div>
    <div class=" w-1/2 min-h-full flex   items-center align-center ml-8">
        <div class="bg-gray-200 flex  justify-center  ">
            <div class="container ">
                <input type="text" placeholder="Rechercher..." class="p-2 border border-gray-300 rounded-md">
                <button class="ml-2 bg-blue-500 text-white px-4 py-2 rounded-md">Rechercher</button>
            </div>
        </div>
    </div>
    </header>
    <main class="mx-auto h-full  shadow-lg flex mt-10 mb-5 w-1/3 bg-blue-300">

         
      
            <div class="max-w-md mx-auto flex justify-center mt-8">

        
                <form action="/clients" method="post" class="bg-white h-full shadow-md rounded px-8 pt-6 pb-8 mb-4 ">
                    <h2 class="text-2xl font-bold mb-4">Ajouter un nouveau client</h2>
    
                    <!-- Email -->
                    <div class="mb-4">
                        <label for="email" class="block text-gray-700 text-sm font-bold mb-2">Paiement :</label>
                        <input type="email" name="email" id="email" class="p-2 border border-gray-300 rounded-md w-full focus:outline-none focus:border-blue-500">
                    </div>
                  
                    <!-- Type de client (Champ de sélection) -->
                    <div class="mb-4">
                        
                        <label for="type_client" class="block text-gray-700 text-sm font-bold mb-2">Entreprise :</label>
                        <select name="type_client" id="type_client" class="p-2 border border-gray-300 rounded-md w-full focus:outline-none focus:border-blue-500">
                            <option value="particulier">Particulier</option>
                            <option value="entreprise">Entreprise</option>
                            <option value="particulier">Particulier</option>
                            <option value="entreprise">Entreprise</option>
                            <option value="particulier">Particulier</option>
                            <option value="entreprise">Entreprise</option>
                        </select>
                        <label for="type_client" class="block text-gray-700 text-sm font-bold mb-2">Mois :</label>
                        <select name="type_client" id="type_client" class="p-2 border border-gray-300 rounded-md w-full focus:outline-none focus:border-blue-500">
                            <option value="particulier">Janvier</option>
                            <option value="entreprise">Fevrier</option>
                            <option value="particulier">Mars</option>
                            <option value="entreprise">Avril</option>
                            <option value="particulier">Mai</option>
                            <option value="entreprise">Juin</option>
                            <option value="particulier">Juillet</option>
                            <option value="entreprise">Aout</option>
                            <option value="particulier">Septembre</option>
                            <option value="entreprise">Ocotobre</option>
                            <option value="particulier">Novembre</option>
                            <option value="entreprise">JDecembre</option>
                        </select>
                    </div>
        
                    <!-- Bouton de soumission -->
                    <div class="flex items-center justify-center">
                        <button type="submit" class="bg-blue-500 text-white px-8 py-2 rounded-md focus:outline-none focus:shadow-outline-blue hover:bg-blue-600">
                                    Payer
                        </button>
                    </div>
                </form>
        </form>
    </main>
    
    <footer class="w-full bg-gray-300 h-28 "><h1 class=" flex justify-center ">Réalisaser </h1></footer>
</body>
</html>
